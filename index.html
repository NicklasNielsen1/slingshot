<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slingshot</title>
<style>
  * { box-sizing: border-box; }
  /* Without this, any element given its own "display" style would ignore the hidden attribute. */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; color: #dfe6ff;
    font-family: system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .panel { background: rgba(14, 18, 36, .85); border: 1px solid #2b3358; border-radius: 12px;
    padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { position: fixed; top: 12px; left: 12px; max-width: min(420px, calc(100% - 24px));
    pointer-events: none; }   /* clicks pass through, so you can still aim underneath it */
  #hud h1 { margin: 0; font-size: 17px; }
  #hud p { margin: 3px 0 0; font-size: 13px; color: #9aa6d6; }
  #hud .shots { color: #dfe6ff; }
  #buttons { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex;
    gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 24px); }
  button, a.btn { font: inherit; font-size: 13px; color: #dfe6ff; background: #1b2244; border: 1px solid #36407a;
    border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { background: #262f5e; }
  button.primary { background: #4254c5; border-color: #8a9bff; }
  #btnLaunch { font-weight: 600; padding-left: 22px; padding-right: 22px; }
  /* Phones and other small or touch screens: bigger buttons, smaller info panel. */
  @media (pointer: coarse), (max-width: 700px) {
    #buttons button { padding: 11px 16px; font-size: 15px; }
    #hud { padding: 7px 9px; max-width: min(300px, calc(100% - 24px)); }
    #hud h1 { font-size: 14px; }
    #hud p { font-size: 11.5px; margin-top: 2px; }
  }
  html, body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  button:disabled { opacity: .4; cursor: default; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 6, 13, .72); padding: 16px; overflow: auto; }
  .overlay[hidden] { display: none; }
  .card { width: min(560px, 100%); max-height: 100%; overflow: auto; text-align: center; padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 26px; letter-spacing: 1px; }
  .card p { margin: 4px 0 12px; color: #9aa6d6; font-size: 14px; }
  .world { text-align: left; margin-top: 14px; }
  .world h3 { margin: 0 0 6px; font-size: 14px; color: #9aa6d6; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .lvl { padding: 8px 4px; text-align: center; line-height: 1.25; }
  .lvl b { display: block; font-size: 13px; }
  .lvl span { font-size: 13px; color: #ffd75e; letter-spacing: 1px; }
  .stars { font-size: 40px; color: #ffd75e; letter-spacing: 6px; margin: 6px 0; }
  .stars i { color: #39406a; font-style: normal; }
  .rowc { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="panel" hidden>
  <h1 id="lvlName"></h1>
  <p id="lvlHint"></p>
  <p class="shots" id="lvlShots"></p>
  <p id="turn" hidden style="color:#ffb347">Tip: turn your phone sideways for a bigger view.</p>
</div>

<div id="buttons" hidden>
  <button id="btnMenu">Levels</button>
  <button id="btnSolution">Show solution</button>
  <button id="btnLaunch" class="primary" disabled>Launch</button>
</div>

<div id="menu" class="overlay">
  <div class="card panel">
    <h2>SLINGSHOT</h2>
    <p>Drag anywhere on the screen to aim, press Launch, and let gravity bend your probe's path into the green ring.</p>
    <p id="devNote" hidden style="color:#ffb347">Dev mode: all levels unlocked. Type "dev" again to turn it off.</p>
    <div id="worlds"></div>
    <div class="rowc"><a class="btn" href="sandbox.html">Free play (sandbox)</a></div>
  </div>
</div>

<div id="win" class="overlay" hidden>
  <div class="card panel">
    <h2 id="winTitle"></h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <div class="rowc">
      <button id="btnReplay">Play again</button>
      <button id="btnWinMenu">Levels</button>
      <button id="btnNext" class="primary">Next level</button>
    </div>
  </div>
</div>

<script src="physics.js"></script>
<script src="levels/world1.js"></script>
<script src="levels/world2.js"></script>
<script src="levels/world3.js"></script>
<script src="levels/world4.js"></script>
<script src="levels/world5.js"></script>
<script src="levels/world6.js"></script>
<script>
const P = Physics;
const LEVELS = globalThis.LEVELS || [];
const WORLD_NAMES = { 1: 'World 1 Â· First Flights', 2: 'World 2 Â· Moving Targets', 3: 'World 3 Â· Stardust and Repulsors',
  4: 'World 4 Â· Wormholes', 5: 'World 5 Â· Mirror Walls', 6: 'World 6 Â· Speed Gates' };
const PORTAL_COLORS = ['#5fd0ff', '#ff8ad8', '#ffd75e', '#9dff8a'];
const worldOf = level => +level.id.match(/^w(\d+)/)[1];
const $ = id => document.getElementById(id);

// ---------- Saved progress ----------
// Stars per level are kept in localStorage, the browser's small per-site storage.
const SAVE_KEY = 'slingshot-progress';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }
// Dev mode opens every level for testing. Turn it on or off by typing the letters d, e, v
// anywhere on the page (or add ?unlock to the address). It is remembered in this browser.
const DEV_KEY = 'slingshot-dev';
let unlockAll = location.search.includes('unlock');
try { unlockAll = unlockAll || localStorage.getItem(DEV_KEY) === '1'; } catch (e) {}
let typed = '';
addEventListener('keydown', e => {
  if (e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-3);
  if (typed !== 'dev') return;
  typed = '';
  unlockAll = !unlockAll;
  try { localStorage.setItem(DEV_KEY, unlockAll ? '1' : '0'); } catch (e) {}
  if (mode === 'menu') showMenu();
  else message = { until: clock + 2.2, text: unlockAll ? 'Dev mode on: all levels unlocked' : 'Dev mode off' };
});
const isUnlocked = i => unlockAll || i === 0 || progress[LEVELS[i - 1].id] > 0;

// ---------- Game state ----------
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, zoom = 1;
let mode = 'menu';          // 'menu' | 'aim' | 'fly' | 'won'
let levelIndex = 0, level = null, st = null;
let shots = 0, usedSolution = false;
let aim = null;             // launch being aimed: {vx, vy}
let trail = [], ghost = []; // path of this shot, and of the previous one
let sparks = [], message = null, clock = 0, stepBank = 0;
let aiming = false;         // true while the pointer is held down to aim

function startLevel(i) {
  if (!LEVELS[i] || !isUnlocked(i)) return;      // no such level, or still locked
  aiming = false; aim = null;
  levelIndex = i; level = LEVELS[i];
  shots = 0; usedSolution = false; ghost = []; sparks = []; message = null;
  resetShot();
  $('menu').hidden = true; $('win').hidden = true; $('hud').hidden = false; $('buttons').hidden = false;
  $('lvlName').textContent = `${level.id.slice(1).replace('-', '.')}  ${level.name}`;
  $('lvlHint').textContent = level.hint;
  updateShots();
}

function resetShot() {
  st = P.createState(level);
  trail = []; stepBank = 0; mode = 'aim';     // the last aim is kept, so you can adjust it and try again
}

function updateShots() {
  $('lvlShots').textContent = `Shots: ${shots}  Â·  3 stars in ${level.par} or fewer`;
}

function fire(vx, vy) {
  if (mode !== 'aim') return;
  P.launch(st, vx, vy);
  shots++; trail = [st.probe.x, st.probe.y]; mode = 'fly'; aiming = false; message = null;
  updateShots();
}

function starsFor(n, par) { return n <= par ? 3 : n <= par * 2 ? 2 : 1; }

function endFlight(result) {
  const p = st.probe;
  if (result === 'win') {
    mode = 'won';
    burst(level.target.x, level.target.y, '#7dffb0', 40);
    const last = levelIndex === LEVELS.length - 1;
    let stars = 0;
    if (usedSolution) {
      $('winTitle').textContent = 'That is the solution';
      $('winText').textContent = 'Now try it yourself to earn stars.';
    } else {
      stars = starsFor(shots, level.par);
      progress[level.id] = Math.max(progress[level.id] || 0, stars);
      saveProgress();
      $('winTitle').textContent = last ? 'You finished the game!' : 'Level complete';
      $('winText').textContent = `Solved in ${shots} shot${shots === 1 ? '' : 's'}.`;
    }
    $('winStars').innerHTML = 'â˜…'.repeat(stars) + '<i>' + 'â˜…'.repeat(3 - stars) + '</i>';
    $('btnNext').hidden = last || !isUnlocked(levelIndex + 1);
    setTimeout(() => { if (mode === 'won') $('win').hidden = false; }, 700);
    return;
  }
  if (result === 'crash') burst(p.x, p.y, '#ffb36b', 24);
  message = { until: clock + 2.2, text:
    result === 'crash' ? 'Crashed!' : result === 'lost' ? 'Lost in space' : 'Out of fuel' };
  ghost = trail;
  resetShot();
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 110;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.7, color });
  }
}

// ---------- Menu ----------
function showMenu() {
  mode = 'menu'; aiming = false; aim = null;
  $('menu').hidden = false; $('win').hidden = true; $('hud').hidden = true; $('buttons').hidden = true;
  $('devNote').hidden = !unlockAll;
  const box = $('worlds');
  box.innerHTML = '';
  const worlds = [...new Set(LEVELS.map(worldOf))];
  for (const w of worlds) {
    const div = document.createElement('div');
    div.className = 'world';
    div.innerHTML = `<h3>${WORLD_NAMES[w] || 'World ' + w}</h3>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    LEVELS.forEach((l, i) => {
      if (worldOf(l) !== w) return;
      const b = document.createElement('button');
      const s = progress[l.id] || 0;
      b.className = 'lvl';
      b.disabled = !isUnlocked(i);
      b.innerHTML = `<b>${l.id.slice(1).replace('-', '.')}</b><span>${b.disabled ? 'ðŸ”’' : 'â˜…'.repeat(s) || '&nbsp;'}</span>`;
      b.title = l.name;
      b.onclick = () => startLevel(i);
      grid.appendChild(b);
    });
    div.appendChild(grid);
    box.appendChild(div);
  }
}

// ---------- Drawing ----------
const bgStars = Array.from({ length: 200 }, () => ({ x: Math.random(), y: Math.random(),
  s: Math.random() * 1.3 + 0.3, a: Math.random() * 0.6 + 0.2 }));
const toScreen = (x, y) => [x * zoom + W / 2, y * zoom + H / 2];
const toWorld = (sx, sy) => [(sx - W / 2) / zoom, (sy - H / 2) / zoom];

function bodyColor(b) {
  if (b.color) return b.color;
  return b.m >= 1e5 ? '#ffe28a' : b.m >= 1e4 ? '#f0a35e' : b.m >= 500 ? '#5fb4ff' : '#cfd6e6';
}

function drawPath(pts, color, alpha, width) {
  if (pts.length < 4) return;
  ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width;
  ctx.beginPath();
  let pen = false;                     // a NaN entry lifts the pen (used when a wormhole moves the probe)
  for (let i = 0; i < pts.length; i += 2) {
    if (isNaN(pts[i])) { pen = false; continue; }
    const [x, y] = toScreen(pts[i], pts[i + 1]);
    pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    pen = true;
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// Wormholes, mirror walls and speed gates (Worlds 4 to 6).
function drawExtras() {
  st.portals.forEach((pair, i) => {
    const color = PORTAL_COLORS[i % PORTAL_COLORS.length];
    const [ax, ay] = toScreen(pair.a.x, pair.a.y), [bx, by] = toScreen(pair.b.x, pair.b.y);
    ctx.strokeStyle = color; ctx.globalAlpha = 0.13; ctx.lineWidth = 1; ctx.setLineDash([3, 9]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();   // faint line joining the pair
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    for (const [x, y, dir] of [[ax, ay, 1], [bx, by, -1]]) {
      const r = P.PORTAL_R * zoom;
      ctx.fillStyle = color + '22'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {                    // three arcs that spin, like a swirl
        const a = clock * 2 * dir + k * Math.PI * 2 / 3;
        ctx.beginPath(); ctx.arc(x, y, r, a, a + 1.3); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, r * 0.55, -a, -a + 1.1); ctx.stroke();
      }
    }
  });

  ctx.lineCap = 'round';
  for (const w of st.walls) {
    const [x1, y1] = toScreen(w.x1, w.y1), [x2, y2] = toScreen(w.x2, w.y2);
    ctx.strokeStyle = 'rgba(150,220,255,.25)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();    // soft glow
    ctx.strokeStyle = '#d6f1ff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  for (const g of st.gates) {
    const [x, y] = toScreen(g.x, g.y), r = P.GATE_R * zoom;
    const color = g.boost > 1 ? '#ffb347' : '#ff6b8a';   // orange = faster, pink = brake
    ctx.globalAlpha = g.used ? 0.3 : 1;
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([7, 5]); ctx.lineDashOffset = -clock * 14;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.fillStyle = color + '1c'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = color; ctx.font = `600 ${Math.max(10, Math.round(13 * zoom + 4))}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Ã—' + g.boost, x, y);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);
  for (const s of bgStars) { ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  if (!st) return;

  // The edge of space: go past this dashed line and the probe is lost.
  const [bx, by] = toScreen(-P.BOUNDS.x, -P.BOUNDS.y);
  ctx.strokeStyle = 'rgba(138,155,255,.22)'; ctx.lineWidth = 1; ctx.setLineDash([6, 8]);
  ctx.strokeRect(bx, by, P.BOUNDS.x * 2 * zoom, P.BOUNDS.y * 2 * zoom);
  ctx.setLineDash([]);

  // Target ring. It stays dim until all the stardust has been collected.
  const tg = level.target, [tx, ty] = toScreen(tg.x, tg.y);
  const ready = st.dust.every(d => d.got), pulse = 1 + 0.06 * Math.sin(clock * 4);
  ctx.strokeStyle = ready ? '#7dffb0' : '#4c7a63'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(tx, ty, tg.r * zoom * pulse, 0, 7); ctx.stroke();
  ctx.fillStyle = ready ? 'rgba(125,255,176,.14)' : 'rgba(125,255,176,.05)';
  ctx.beginPath(); ctx.arc(tx, ty, tg.r * zoom * pulse, 0, 7); ctx.fill();
  ctx.fillStyle = ready ? '#7dffb0' : '#4c7a63';
  ctx.beginPath(); ctx.arc(tx, ty, 3, 0, 7); ctx.fill();

  // Stardust: little four-pointed sparkles.
  for (const d of st.dust) {
    if (d.got) continue;
    const [x, y] = toScreen(d.x, d.y), r = (7 + Math.sin(clock * 5 + d.x) * 1.5) * Math.max(0.7, zoom);
    ctx.fillStyle = '#ffd75e';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + clock * 0.8, rr = i % 2 ? r * 0.35 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,94,.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, P.DUST_R * zoom, 0, 7); ctx.stroke();
  }

  drawExtras();
  drawPath(ghost, '#8a9bff', 0.3, 1.5);       // the previous shot, to help adjust the next one
  drawPath(trail, '#ffffff', 0.85, 2);

  for (const b of st.bodies) {
    const [x, y] = toScreen(b.x, b.y), r = Math.max(1.5, b.r * zoom);
    if (b.m < 0) {                             // repulsor: purple core with rings moving outwards
      for (let k = 0; k < 3; k++) {
        const f = (clock * 0.5 + k / 3) % 1;
        ctx.strokeStyle = `rgba(214,120,255,${0.5 * (1 - f)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r * (1 + f * 2.2), 0, 7); ctx.stroke();
      }
      ctx.fillStyle = '#b44dff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.fillStyle = '#f1d6ff'; ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, 7); ctx.fill();
      continue;
    }
    const color = bodyColor(b);
    if (b.m >= 1e5) {                          // stars glow
      const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3.5);
      g.addColorStop(0, color + 'aa'); g.addColorStop(1, color + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.5, 0, 7); ctx.fill();
    }
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    if (b.m >= 1e5) { ctx.fillStyle = '#fffbe8'; ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, 7); ctx.fill(); }
  }

  // Launch pad and probe.
  const [px, py] = toScreen(level.pad.x, level.pad.y);
  ctx.strokeStyle = '#8a9bff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, 11, 0, 7); ctx.stroke();
  const probe = st.probe || level.pad;
  if (mode !== 'won') {
    const [qx, qy] = toScreen(probe.x, probe.y);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(qx, qy, 4, 0, 7); ctx.fill();
  }

  if (aim && mode === 'aim') drawAim(px, py);

  for (const s of sparks) {
    const [x, y] = toScreen(s.x, s.y);
    ctx.globalAlpha = Math.min(1, s.life * 2); ctx.fillStyle = s.color;
    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  if (message && clock < message.until) {
    ctx.globalAlpha = Math.min(1, (message.until - clock) * 2);
    ctx.fillStyle = '#ffb36b'; ctx.font = '600 22px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(message.text, W / 2, H * 0.2);
    ctx.globalAlpha = 1;
  }
}

// While aiming: an arrow, the power, and the first moment of the real flight path as dots.
function drawAim(px, py) {
  const speed = Math.hypot(aim.vx, aim.vy);
  // The arrow has a fixed size on screen (110 pixels at full power), so it is easy to see on a phone.
  const ex = px + aim.vx / P.MAX_SPEED * 110, ey = py + aim.vy / P.MAX_SPEED * 110;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex, ey, 4, 0, 7); ctx.fill();
  ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`Power ${Math.round(100 * speed / P.MAX_SPEED)}%`, px, py + (aim.vy > 0 ? -18 : 30));

  const ghostState = P.createState(level);
  P.launch(ghostState, aim.vx, aim.vy);
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 1; i <= 96 && !P.stepState(ghostState); i++) {
    if (i % 8 === 0) { const [x, y] = toScreen(ghostState.probe.x, ghostState.probe.y); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; clock += dt;
  if (mode === 'fly') advance(dt);
  $('btnLaunch').disabled = !(mode === 'aim' && aim);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  draw();
  requestAnimationFrame(frame);
}

// Run as many fixed physics steps as fit into the time that has passed.
function advance(dt) {
  stepBank += dt;
  while (stepBank >= P.DT && mode === 'fly') {
    stepBank -= P.DT;
    const result = P.stepState(st);
    for (const e of st.events) {               // a bounce, wormhole trip or gate happened this step
      if (e.type === 'wall') { trail.push(e.x, e.y); burst(e.x, e.y, '#d6f1ff', 6); }
      if (e.type === 'portal') { trail.push(e.x, e.y, NaN, NaN); burst(e.x, e.y, '#ffffff', 10); burst(st.probe.x, st.probe.y, '#ffffff', 10); }
      if (e.type === 'gate') burst(e.x, e.y, '#ffb347', 14);
    }
    st.events.length = 0;
    trail.push(st.probe.x, st.probe.y);
    if (result) endFlight(result);
  }
}

// ---------- Input ----------
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
  // Big screens show the whole of space out to the dashed edge. Small screens (phones) zoom in
  // on the play area itself, where everything in a level sits, so things are not tiny.
  const view = Math.min(W, H) < 600 ? P.AREA : P.BOUNDS;
  zoom = Math.min(W / (view.x * 2 + 40), H / (view.y * 2 + 40));
  $('turn').hidden = !(H > W && W < 600);
}
addEventListener('resize', resize);

// Aiming works like a trackpad: press anywhere and drag. The drag moves the tip of the aim
// arrow, starting from wherever the arrow already was, so your finger never has to be on the
// launch pad and never covers it. Short drags make small adjustments. Nothing launches until
// the Launch button (or the space bar) is pressed.
let dragStart = null;       // where the current drag began, and the aim at that moment
function setAim(e) {
  const full = Math.max(140, Math.min(W, H) * 0.45);    // pixels of drag that give full power
  const k = P.MAX_SPEED / full;
  aim = P.clampLaunch(dragStart.vx + (e.clientX - dragStart.x) * k, dragStart.vy + (e.clientY - dragStart.y) * k);
}
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'aim' || e.button !== 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}   // keeps the drag even if the finger leaves the canvas
  aiming = true;
  dragStart = { x: e.clientX, y: e.clientY, vx: aim ? aim.vx : 0, vy: aim ? aim.vy : 0 };
});
canvas.addEventListener('pointermove', e => { if (aiming && mode === 'aim') setAim(e); });
function endDrag() {
  aiming = false;
  if (aim && Math.hypot(aim.vx, aim.vy) < 5) aim = null;      // dragged back to nothing
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function launchAim() { if (mode === 'aim' && aim && !aiming) fire(aim.vx, aim.vy); }
$('btnLaunch').onclick = launchAim;

$('btnMenu').onclick = showMenu;
$('btnWinMenu').onclick = showMenu;
$('btnReplay').onclick = () => startLevel(levelIndex);
$('btnNext').onclick = () => startLevel(levelIndex + 1);
$('btnSolution').onclick = () => {
  if (mode !== 'aim') return;
  usedSolution = true;
  fire(level.solution.vx, level.solution.vy);
};
addEventListener('keydown', e => {
  if (e.code === 'Escape' && mode !== 'menu') showMenu();
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); launchAim(); }
  // Enter means "next level", unless a button has the keyboard focus (then Enter presses that button).
  if (e.code === 'Enter' && e.target.tagName !== 'BUTTON' && mode === 'won' && !$('win').hidden && !$('btnNext').hidden)
    startLevel(levelIndex + 1);
});

// A small handle used for testing from the browser console.
window.game = {
  levels: LEVELS, startLevel, fire, showMenu,
  get mode() { return mode; }, get shots() { return shots; }, get progress() { return progress; },
  get state() { return st; },
  finishFlight() { while (mode === 'fly') advance(P.DT); return mode; },
};

resize();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
