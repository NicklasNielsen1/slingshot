<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Sandbox</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; color: #dfe6ff;
    font-family: system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .panel { position: fixed; background: rgba(14, 18, 36, .82); border: 1px solid #2b3358;
    border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; max-width: min(430px, calc(100% - 24px)); }
  #top h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: .5px; }
  #top p { margin: 0 0 8px; font-size: 13px; color: #9aa6d6; }
  #bottom { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap;
    gap: 8px 14px; align-items: center; justify-content: center; width: max-content;
    max-width: calc(100% - 24px); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .label { font-size: 12px; color: #9aa6d6; }
  button { font: inherit; font-size: 13px; color: #dfe6ff; background: #1b2244; border: 1px solid #36407a;
    border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #262f5e; }
  button.on { background: #4254c5; border-color: #8a9bff; }
  input[type=range] { width: 90px; accent-color: #8a9bff; }
  label { font-size: 13px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
  #stats { position: fixed; top: 12px; right: 12px; font-size: 12px; color: #9aa6d6; text-align: right;
    pointer-events: none; }
  .dot { display: inline-block; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="panel">
  <h1>Gravity Sandbox</h1>
  <p><b>Drag</b> to fling a new body. <b>Scroll</b> to zoom. <b>Right-drag</b> (or Shift-drag) to move the view.
     Everything pulls on everything else, just like real gravity.</p>
  <div class="row" id="presets">
    <span class="label">Scenes:</span>
    <button data-preset="solar">Solar system</button>
    <button data-preset="binary">Twin suns</button>
    <button data-preset="eight">Figure-eight</button>
    <button data-preset="galaxy">Galaxy crash</button>
    <button data-preset="empty">Empty</button>
  </div>
</div>

<div id="stats"></div>

<div id="bottom" class="panel">
  <div class="row" id="kinds">
    <span class="label">Fling a:</span>
  </div>
  <div class="row">
    <button id="pause">Pause</button>
    <span class="label">Speed</span>
    <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
    <label><input id="trails" type="checkbox" checked> Trails</label>
    <label><input id="follow" type="checkbox"> Follow</label>
    <button id="clear">Clear</button>
  </div>
</div>

<script>
// ---------- Settings ----------
// Gravity strength is 1, so "mass" numbers are chosen to give nice speeds on screen.
const SOFT = 4;            // stops gravity becoming infinite when two bodies touch
const SUBSTEPS = 8;        // small physics steps per frame (more = more accurate)
const KINDS = [
  { id: 'asteroid', name: 'Asteroid', mass: 1,     color: '#b9b2a6' },
  { id: 'planet',   name: 'Planet',   mass: 1000,  color: '#5fb4ff' },
  { id: 'giant',    name: 'Giant',    mass: 30000, color: '#f0a35e' },
  { id: 'star',     name: 'Star',     mass: 1e6,   color: '#ffe28a' },
];
const PLANET_COLORS = ['#5fb4ff', '#7be3a4', '#e87f7f', '#c59bff', '#f0a35e', '#6fe0e0', '#f3d27a'];

// ---------- State ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
let bodies = [];
let sparks = [];
const cam = { x: 0, y: 0, zoom: 1 };
let paused = false, speed = 1, showTrails = true, follow = false;
let kind = KINDS[1];
let drag = null;   // while flinging: {sx, sy, ex, ey} in world coordinates
let pan = null;    // while moving the view
let simTime = 0;

// Size on screen grows slowly with mass (a star is not a million times wider than an asteroid).
const radiusFor = m => Math.max(1.5, 0.4 * Math.pow(m, 0.28));

function makeBody(x, y, vx, vy, mass, color) {
  return { x, y, vx, vy, m: mass, r: radiusFor(mass), color, trail: [] };
}

// ---------- Physics ----------
// Work out the pull on every body from every other body (Newton's law of gravity).
function accelerations(list) {
  const n = list.length;
  for (let i = 0; i < n; i++) { list[i].ax = 0; list[i].ay = 0; }
  for (let i = 0; i < n; i++) {
    const a = list[i];
    for (let j = i + 1; j < n; j++) {
      const b = list[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy + SOFT * SOFT;
      const inv = 1 / (d2 * Math.sqrt(d2));
      a.ax += b.m * dx * inv; a.ay += b.m * dy * inv;
      b.ax -= a.m * dx * inv; b.ay -= a.m * dy * inv;
    }
  }
}

// Move time forward by dt seconds. Uses the "leapfrog" method: half-kick the speed,
// move, then half-kick again. It keeps orbits stable for a long time.
function step(dt) {
  const h = dt / SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++) {
    accelerations(bodies);
    for (const b of bodies) { b.vx += b.ax * h / 2; b.vy += b.ay * h / 2; b.x += b.vx * h; b.y += b.vy * h; }
    accelerations(bodies);
    for (const b of bodies) { b.vx += b.ax * h / 2; b.vy += b.ay * h / 2; }
    collide();
  }
  simTime += dt;
  for (const b of bodies) {
    b.trail.push(b.x, b.y);
    const max = b.m >= 500 ? 600 : 120;      // numbers stored as x,y pairs
    if (b.trail.length > max) b.trail.splice(0, b.trail.length - max);
  }
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  sparks = sparks.filter(p => p.life > 0);
}

// When two bodies touch they merge into one. Mass and momentum (mass x speed) are kept.
function collide() {
  let merged = false;
  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < bodies.length; j++) {
      const b = bodies[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = (a.r + b.r) * 0.8;
      if (dx * dx + dy * dy < rr * rr) {
        const big = a.m >= b.m ? a : b, m = a.m + b.m;
        const x = (a.x * a.m + b.x * b.m) / m, y = (a.y * a.m + b.y * b.m) / m;
        burst(b.m < a.m ? b : a, big);
        a.vx = (a.vx * a.m + b.vx * b.m) / m; a.vy = (a.vy * a.m + b.vy * b.m) / m;
        a.color = big.color; a.trail = big.trail;
        a.x = x; a.y = y; a.m = m; a.r = radiusFor(m);
        b.dead = true; merged = true;
      }
    }
  }
  if (merged) bodies = bodies.filter(b => !b.dead);
}

function burst(small, big) {
  const n = Math.min(24, 4 + Math.round(small.r * 3));
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90;
    sparks.push({ x: small.x, y: small.y, vx: big.vx + Math.cos(ang) * sp, vy: big.vy + Math.sin(ang) * sp,
      life: 0.4 + Math.random() * 0.6, color: small.color });
  }
}

// Total energy (movement + gravity). Should stay nearly constant; used for testing.
function energy() {
  let e = 0;
  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    e += 0.5 * a.m * (a.vx * a.vx + a.vy * a.vy);
    for (let j = i + 1; j < bodies.length; j++) {
      const b = bodies[j];
      e -= a.m * b.m / Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2 + SOFT * SOFT);
    }
  }
  return e;
}

// ---------- Scenes ----------
// Speed needed for a circular orbit at distance r around a mass M.
const orbitSpeed = (M, r) => Math.sqrt(M / r);

function addOrbiter(centre, r, mass, color, angle = Math.random() * Math.PI * 2, dir = 1) {
  const v = orbitSpeed(centre.m + mass, r) * dir;
  const b = makeBody(centre.x + Math.cos(angle) * r, centre.y + Math.sin(angle) * r,
    centre.vx - Math.sin(angle) * v, centre.vy + Math.cos(angle) * v, mass, color);
  bodies.push(b);
  return b;
}

const PRESETS = {
  empty() {},
  solar() {
    const sun = makeBody(0, 0, 0, 0, 1e6, '#ffe28a');
    bodies.push(sun);
    [[70, 300], [115, 900], [165, 1000], [220, 500]].forEach(([r, m], i) => addOrbiter(sun, r, m, PLANET_COLORS[i]));
    const giant = addOrbiter(sun, 330, 30000, '#f0a35e');
    addOrbiter(giant, 22, 5, '#cfd6e6'); addOrbiter(giant, 32, 5, '#cfd6e6');
    addOrbiter(sun, 440, 12000, '#6fe0e0');
    for (let i = 0; i < 60; i++) addOrbiter(sun, 265 + Math.random() * 25, 1, '#b9b2a6');
  },
  binary() {
    const a = makeBody(-60, 0, 0, 0, 1e6, '#ffe28a'), b = makeBody(60, 0, 0, 0, 6e5, '#ff9a6b');
    const v = orbitSpeed(a.m + b.m, 120);
    a.vy = -v * b.m / (a.m + b.m); b.vy = v * a.m / (a.m + b.m);
    bodies.push(a, b);
    const centre = { x: (a.x * a.m + b.x * b.m) / (a.m + b.m), y: 0, vx: 0, vy: 0, m: a.m + b.m };
    [340, 430, 540].forEach((r, i) => addOrbiter(centre, r, 1500, PLANET_COLORS[i + 1]));
    for (let i = 0; i < 40; i++) addOrbiter(centre, 620 + Math.random() * 60, 1, '#b9b2a6');
  },
  // A famous solution to the "three-body problem": three equal stars chase each other
  // around a figure-eight forever. Found by Cris Moore in 1993.
  eight() {
    const L = 170, M = 1.5e6, V = Math.sqrt(M / L);
    const px = 0.97000436, py = 0.24308753, vx = 0.93240737, vy = 0.86473146;
    bodies.push(makeBody(-px * L,  py * L, -vx / 2 * V, -vy / 2 * V, M, '#ffe28a'));
    bodies.push(makeBody( px * L, -py * L, -vx / 2 * V, -vy / 2 * V, M, '#7be3a4'));
    bodies.push(makeBody(0, 0, vx * V, vy * V, M, '#c59bff'));
  },
  galaxy() {
    const mk = (x, y, vx, vy, color, dir) => {
      const core = makeBody(x, y, vx, vy, 8e5, color);
      bodies.push(core);
      for (let i = 0; i < 150; i++)
        addOrbiter(core, 40 + Math.pow(Math.random(), 0.7) * 170, 1, i % 3 ? '#cfd6ff' : color, undefined, dir);
    };
    // The two galaxies swing past each other rather than hitting head-on,
    // which pulls out long "tails" of stars, as seen in real galaxy collisions.
    mk(-380, -190, 27, 0, '#8fb6ff', 1);
    mk(380, 190, -27, 0, '#ffc38f', -1);
  },
};

function load(name) {
  bodies = []; sparks = []; simTime = 0;
  PRESETS[name]();
  cam.x = 0; cam.y = 0;
  cam.zoom = Math.min(1, Math.min(W, H) / ({ solar: 1000, binary: 1450, eight: 620, galaxy: 1150 }[name] || 800));
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.preset === name));
}

// ---------- Drawing ----------
const stars = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(),
  s: Math.random() * 1.3 + 0.3, a: Math.random() * 0.6 + 0.2 }));

const toScreen = (x, y) => [(x - cam.x) * cam.zoom + W / 2, (y - cam.y) * cam.zoom + H / 2];
const toWorld = (sx, sy) => [(sx - W / 2) / cam.zoom + cam.x, (sy - H / 2) / cam.zoom + cam.y];

function draw() {
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);

  // Background stars drift a little as the view moves, which gives a feeling of depth.
  for (const s of stars) {
    const x = (((s.x * W - cam.x * 0.05 * s.s) % W) + W) % W, y = (((s.y * H - cam.y * 0.05 * s.s) % H) + H) % H;
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fillRect(x, y, s.s, s.s);
  }

  if (showTrails) {
    ctx.lineCap = 'round';
    for (const b of bodies) {
      const t = b.trail, n = t.length / 2;
      if (n < 2) continue;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = Math.max(1, Math.min(3, b.r * cam.zoom * 0.5));
      const parts = 5;                       // drawn in 5 pieces, each brighter than the last
      for (let p = 0; p < parts; p++) {
        const from = Math.floor(n * p / parts), to = Math.min(n - 1, Math.floor(n * (p + 1) / parts));
        if (to <= from) continue;
        ctx.globalAlpha = 0.08 + 0.5 * (p + 1) / parts;
        ctx.beginPath();
        for (let i = from; i <= to; i++) {
          const [x, y] = toScreen(t[i * 2], t[i * 2 + 1]);
          i === from ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  for (const b of bodies) {
    const [x, y] = toScreen(b.x, b.y), r = Math.max(1, b.r * cam.zoom);
    if (b.m >= 1e5) {                        // stars glow
      const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 4);
      g.addColorStop(0, b.color + 'aa'); g.addColorStop(1, b.color + '00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    if (b.m >= 1e5) { ctx.fillStyle = '#fffbe8'; ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, 7); ctx.fill(); }
  }

  for (const p of sparks) {
    const [x, y] = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  ctx.globalAlpha = 1;

  if (drag) drawAim();
}

// While dragging: show the launch arrow and a dotted guess of where the new body will go.
function drawAim() {
  const [sx, sy] = toScreen(drag.sx, drag.sy), [ex, ey] = toScreen(drag.ex, drag.ey);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = kind.color;
  ctx.beginPath(); ctx.arc(sx, sy, Math.max(2, radiusFor(kind.mass) * cam.zoom), 0, 7); ctx.fill();

  // The guess treats the other bodies as standing still, so it is only roughly right.
  let x = drag.sx, y = drag.sy, vx = drag.ex - drag.sx, vy = drag.ey - drag.sy;
  const h = 1 / 60;
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 480; i++) {
    let ax = 0, ay = 0, hit = false;
    for (const b of bodies) {
      const dx = b.x - x, dy = b.y - y, d2 = dx * dx + dy * dy + SOFT * SOFT;
      if (d2 < b.r * b.r) hit = true;
      const inv = b.m / (d2 * Math.sqrt(d2));
      ax += dx * inv; ay += dy * inv;
    }
    if (hit) break;
    vx += ax * h; vy += ay * h; x += vx * h; y += vy * h;
    if (i % 6 === 0) { const [px, py] = toScreen(x, y); ctx.fillRect(px - 1, py - 1, 2, 2); }
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);   // cap so a slow frame can't break the orbits
  last = now;
  if (!paused) step(dt * speed);
  if (follow && bodies.length) {                      // keep the centre of mass in the middle
    let m = 0, x = 0, y = 0;
    for (const b of bodies) { m += b.m; x += b.x * b.m; y += b.y * b.m; }
    cam.x = x / m; cam.y = y / m;
  }
  draw();
  const days = Math.floor(simTime * 10);
  document.getElementById('stats').textContent = `${bodies.length} bodies · day ${days}`;
  requestAnimationFrame(frame);
}

// ---------- Input ----------
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
}
addEventListener('resize', resize);

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  if (e.button === 2 || e.button === 1 || e.shiftKey) {
    pan = { x: e.clientX, y: e.clientY };
  } else {
    const [x, y] = toWorld(e.clientX, e.clientY);
    drag = { sx: x, sy: y, ex: x, ey: y };
  }
});
canvas.addEventListener('pointermove', e => {
  if (pan) {
    cam.x -= (e.clientX - pan.x) / cam.zoom; cam.y -= (e.clientY - pan.y) / cam.zoom;
    pan = { x: e.clientX, y: e.clientY };
  } else if (drag) {
    [drag.ex, drag.ey] = toWorld(e.clientX, e.clientY);
  }
});
canvas.addEventListener('pointerup', () => {
  if (drag) {
    // The longer the drag, the faster the launch.
    const color = kind.id === 'planet' ? PLANET_COLORS[Math.floor(Math.random() * PLANET_COLORS.length)] : kind.color;
    bodies.push(makeBody(drag.sx, drag.sy, drag.ex - drag.sx, drag.ey - drag.sy, kind.mass, color));
  }
  drag = null; pan = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; pan = null; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  cam.zoom = Math.max(0.1, Math.min(6, cam.zoom * Math.exp(-e.deltaY * 0.0012)));
  const [nx, ny] = toWorld(e.clientX, e.clientY);     // keep the point under the mouse still
  cam.x += wx - nx; cam.y += wy - ny;
}, { passive: false });

const kindsEl = document.getElementById('kinds');
KINDS.forEach(k => {
  const b = document.createElement('button');
  const d = Math.round(Math.min(14, radiusFor(k.mass) * 1.2 + 4));
  b.innerHTML = `<span class="dot" style="width:${d}px;height:${d}px;background:${k.color}"></span>${k.name}`;
  b.classList.toggle('on', k === kind);
  b.onclick = () => { kind = k; [...kindsEl.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b)); };
  kindsEl.appendChild(b);
});
document.querySelectorAll('#presets button').forEach(b => b.onclick = () => load(b.dataset.preset));
const pauseBtn = document.getElementById('pause');
function setPaused(p) { paused = p; pauseBtn.textContent = p ? 'Play' : 'Pause'; pauseBtn.classList.toggle('on', p); }
pauseBtn.onclick = () => setPaused(!paused);
document.getElementById('speed').oninput = e => speed = +e.target.value;
document.getElementById('trails').onchange = e => showTrails = e.target.checked;
document.getElementById('follow').onchange = e => follow = e.target.checked;
document.getElementById('clear').onclick = () => load('empty');
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); } });

// A small handle used for testing from the browser console.
window.sim = { get bodies() { return bodies; }, step, energy, load, setPaused, cam };

resize();
load('solar');
requestAnimationFrame(frame);
</script>
</body>
</html>
